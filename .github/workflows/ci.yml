name: TempConverter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8

        env:
          MYSQL_ROOT_PASSWORD: rootpassword123
          MYSQL_DATABASE: tempconverter
          MYSQL_USER: tempuser
          MYSQL_PASSWORD: temppassword123

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USER: tempuser
      DB_PASS: temppassword123
      DB_HOST: 127.0.0.1
      DB_NAME: tempconverter
      STUDENT: Luka Badzek
      COLLEGE: Algebra Bernays University

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/test_unit.py -v

      - name: Run integration tests
        run: pytest tests/test_integration.py -v

      - name: Build container image
        run: docker build -t tempconverter:ci .